<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Tlias智能学习辅助系统</title>
    <style>
        #container {
            width: 80%;
            margin: 0 auto;
        }
        /* 导航栏样式 */
        .navbar{
            background-color: #d3d3d3;/* 导航栏背景颜色 */
            display: flex;/* 元素水平居中 */
            justify-content: space-between;/* 元素之间间隔 */
            padding: 10px;/* 导航栏内元素与边界之间的间隔 */
            align-items: center;/* 元素垂直居中 */
        }
        .navbar h1{
            margin: 0;/* 取消导航栏内元素的默认外边距 */
            font-weight: bold;/* 导航栏标题加粗 */
            color: white;
            font-family: "楷体";/* 导航栏标题字体 */
        }
        .navbar a{
            color:white;/* 导航栏内元素文字颜色 */
            text-decoration: none;/* 取消导航栏内元素的默认下划线 */
        }
        /* 搜索表单样式 */
        .search-form{
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }
        .search-form input[type="text"], .search-form select{
            padding: 5px;
            width: 260px;
        }
        .search-form button{
            padding: 5px 15px;
        }
        /* 表格样式 */
        .data-table{
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .data-table th, .data-table td{
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        .data-table th{
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .data-table tr:nth-child(even){
            background-color: #f9f9f9;
        }
        .data-table a{
            color: #FFA500;
            text-decoration: none;
            margin: 0 5px;
        }
        .data-table a:hover{
            text-decoration: underline;
        }
        /* 版权区域样式 */
        .footer{
            background-color: #d3d3d3;
            color: #ffffff;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
            font-size: 14px;
        }
        .footer p{
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- 顶部导航栏 -->
     <div class="navbar">
        <h1>Tlias智能学习辅助系统</h1>
        <a href="#">退出登录</a>
     </div>
     <!-- 搜索表单区域 -->
     <form class="search-form" action="/search" method="post">
        <label for="name">姓名：</label>
        <input type="text" id="name" name="name" v-model="searchForm.name" placeholder="请输入姓名">
        <label for="gender">性别：</label>
        <select id="gender" name="gender" v-model="searchForm.gender">
            <option value=""></option>
            <option value="1">男</option>
            <option value="2">女</option>
        </select>
        <label for="position">职位：</label>
        <select name="position" id="position" v-model="searchForm.job">
            <option value=""></option>
            <option value="1">班主任</option>
            <option value="2">讲师</option>
            <option value="3">学工主管</option>
            <option value="4">教研主管</option>
            <option value="5">咨询师</option>
        </select>

        <button type="button" v-on:click="search">查询</button>
        <button type="button" @click="clear">清空</button>
     </form>
     <!-- 数据表格区域 -->
     <table class="data-table">
        <thead>
            <tr>
                <th>序号</th>
                <th>姓名</th>
                <th>性别</th>
                <th>头像</th>
                <th>职位</th>
                <th>入职日期</th>
                <th>最后操作时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr v-for="(e,index) in empList" :key="e.id">
                <td>{{index+1}}</td>
                <td>{{e.name}}</td>
                <td>{{e.gender == 1 ? '男' : '女'}}</td>
                <td><img class="avatar" :src="e.image" :alt="e.name" width="45" height="45"></td>
                <!-- 注意：插值表达式不能出现在标签内部 ！！！ -->
                <!-- v-if控制元素的显示与隐藏 -->
                <!-- <td>
                    <span v-if ="e.job==1">班主任</span>
                    <span v-else-if ="e.job==2">讲师</span>
                    <span v-else-if ="e.job==3">学工主管</span>
                    <span v-else-if ="e.job==4">教研主管</span>
                    <span v-else-if ="e.job==5">咨询师</span>
                    <span v-else>其他</span>
                </td> -->

                <!-- v-show控制元素的显示与隐藏 -->
                <td>
                    <span v-show ="e.job==1">班主任</span>
                    <span v-show ="e.job==2">讲师</span>
                    <span v-show ="e.job==3">学工主管</span>
                    <span v-show ="e.job==4">教研主管</span>
                    <span v-show ="e.job==5">咨询师</span>
                </td>
                <td>{{e.entrydate}}</td>
                <td>{{e.updatetime}}</td>
                <td>
                    <a href="#">编辑</a>
                    <a href="#">删除</a>
                </td>
            </tr>
            
        </tbody>
     </table>
     <!-- 版权区域 -->
     <div class="footer">
        <p>江苏传智播客教育科技股份有限公司</p>
        <p>版权所有Copyright 2006-2024 All Rights Reserved</p>
     </div>
    </div>

    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script type="module">
        import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'

        createApp({
            data(){
                return{
                    searchForm:{//封装用户输入的查询条件
                        name:'',
                        gender:'',
                        job:''
                    },
                    empList:[]
                }
            },
            methods:{
                /* search(){
                    //发送ajax异步请求，获取数据
                    axios.get(`https://web-server.itheima.net/emps/list?name=${this.searchForm.name}&gender=${this.searchForm.gender}&job=${this.searchForm.job}`).then((result) => {
                        this.empList=result.data.data
                    })
                }, */
                async search(){
                    //发送ajax同步请求，获取数据
                    let result=await axios.get(`https://web-server.itheima.net/emps/list?name=${this.searchForm.name}&gender=${this.searchForm.gender}&job=${this.searchForm.job}`)
                    this.empList=result.data.data
                },
                clear(){
                    //清空表单各项数据
                    this.searchForm = {name:'',gender:'',job:''}
                    this.search()
                }
            },
            //钩子函数
            mounted(){
                //页面加载完成之后发送ajax请求，获取数据
                this.search()
            }
        }).mount('#container')

        //通过JS为上述的表格中数据行添加事件监听，实现鼠标进入后，背景色#f2e2e2；鼠标离开后，背景色需要设置为#fff;(JS新版本语法)

        // 获取表格 tbody 中的所有行
        const rows = document.querySelectorAll('.data-table tbody tr');

        // 遍历每一行并添加事件监听器
        rows.forEach(row => {
            // 鼠标进入事件
            row.addEventListener('mouseenter', () => {
                row.style.backgroundColor = '#f2e2e2';
            });

            // 鼠标离开事件
            row.addEventListener('mouseleave', () => {
                row.style.backgroundColor = '#fff';
            });
        });
    </script>
</body>
</html>
